<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h2>Create Account</h2>
    <p class="subtitle">Naya account banayein</p>

    <div id="alert" class="alert"></div>

    <form id="signupForm" novalidate>
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Apna naam likhein" autocomplete="name" />
        <div class="error-msg"></div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
        <div class="error-msg"></div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Kam az kam 6 characters" autocomplete="new-password" />
          <span class="toggle-pass" data-target="password">Show</span>
        </div>
        <div class="error-msg"></div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-wrap">
          <input type="password" id="confirmPassword" placeholder="Password dobara likhein" autocomplete="new-password" />
          <span class="toggle-pass" data-target="confirmPassword">Show</span>
        </div>
        <div class="error-msg"></div>
      </div>

      <button type="submit" class="btn">Sign Up</button>
    </form>

    <p class="switch">Pehle se account hai? <a href="login.html">Login</a></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
