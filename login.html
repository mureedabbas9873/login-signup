<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h2>Welcome Back</h2>
    <p class="subtitle">Apne account mein login karein</p>

    <div id="alert" class="alert"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
        <div class="error-msg"></div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Password likhein" autocomplete="current-password" />
          <span class="toggle-pass" data-target="password">Show</span>
        </div>
        <div class="error-msg"></div>
      </div>

      <div class="options">
        <label><input type="checkbox" id="remember" /> Remember me</label>
        <a href="#" id="forgotLink">Forgot password?</a>
      </div>

      <button type="submit" class="btn">Login</button>
    </form>

    <p class="switch">Account nahi hai? <a href="signup.html">Sign Up</a></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
